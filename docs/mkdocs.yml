site_name: OneNAS Docs
site_url: https://docs.onenas.io
site_description: OneNAS 官方文档 - Official Documentation
site_author: OneNAS Team

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            首页: Home
            快速入门: Quick Start
            5分钟快速安装OneNAS: 5-Minute Quick Install OneNAS
            存储管理: Storage Management
            如何创建镜像RAID1: How to Create a RAID1 Mirror
      reconfigure_material: true
      reconfigure_search: true

extra:
  alternate:
    - name: 中文
      link: /docs/site/
      lang: zh
    - name: English
      link: /docs/site/en/
      lang: en

nav:
  - 首页: index.md
  - 快速入门:
    - 5分钟快速安装OneNAS: quick-start/index.md
  - 存储管理:
    - 如何创建镜像RAID1: raid1/index.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
